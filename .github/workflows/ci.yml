# Builds the solution, runs every test and measures code coverage on each push
# to main and on every pull request, so broken or untested code is caught early.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # Uses the SDK version pinned in global.json, so CI builds exactly
      # like a developer machine does.
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test with coverage
        run: >
          dotnet test --no-build --configuration Release --verbosity normal
          --collect:"XPlat Code Coverage" --results-directory ./coverage

      # Turns the raw coverage data into a readable summary. The test project
      # itself is excluded, because only the application code needs measuring.
      - name: Generate coverage report
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:"coverage/**/coverage.cobertura.xml" \
            -targetdir:"coverage-report" \
            -reporttypes:"MarkdownSummaryGithub;Html" \
            -assemblyfilters:"-ConsoleApps.Tests"

      # Shows the coverage table on the workflow run's summary page.
      - name: Publish coverage summary
        run: cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      # Keeps the full HTML report as a downloadable artifact.
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report